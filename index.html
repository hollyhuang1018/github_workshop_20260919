<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>待辦清單</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="todo-card" aria-label="待辦清單">
        <h1>待辦清單</h1>

        <form id="todo-form" class="todo-form" autocomplete="off">
          <input
            id="todo-input"
            type="text"
            placeholder="新增待辦事項"
            aria-label="新增待辦事項"
            maxlength="200"
          />
          <button type="submit" class="add-btn">新增</button>
        </form>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <p id="empty-state" class="empty-state" aria-live="polite">
          還沒有任何待辦事項,新增一個吧!
        </p>

        <div class="summary">
          <span id="todo-count">未完成: 0 項</span>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
